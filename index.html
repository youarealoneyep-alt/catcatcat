<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Warm Breeze · Cat Vocab Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background: radial-gradient(circle at 20% 30%, #3d3530, #1f1a17);
            min-height: 100vh;
            padding: 1.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0e6d8;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "🐈";
            position: absolute;
            top: 4%;
            left: 3%;
            font-size: 6rem;
            opacity: 0.12;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        body::after {
            content: "🐾";
            position: absolute;
            bottom: 5%;
            right: 4%;
            font-size: 8rem;
            opacity: 0.1;
            transform: rotate(20deg);
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(45, 40, 35, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7);
            border: 1px solid rgba(232,168,124,0.25);
            position: relative;
            z-index: 10;
        }

        .cat-ears {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 30px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .cat-ears::before, .cat-ears::after {
            content: "";
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 25px solid #e8a87c;
            opacity: 0.5;
        }
        .cat-ears::before { transform: rotate(-15deg); }
        .cat-ears::after { transform: rotate(15deg); }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 350;
            color: #faf2e4;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        h1 .badge {
            background: #6b4f3a;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 1rem;
            color: #fce8d4;
            border: 1px solid #e8a87c;
        }

        .stats-panel {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: center;
            background: rgba(30,25,20,0.55);
            padding: 0.6rem 1.4rem;
            border-radius: 80px;
            border: 1px solid rgba(232,168,124,0.3);
        }
        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 1rem; color: #e8d5c0; }
        .stat-item .value {
            font-weight: 600;
            color: #ffd9b8;
            background: #3d2e24;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            min-width: 45px;
            text-align: center;
            border: 1px solid #7a5f48;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            background: #2a221d;
            padding: 6px;
            border-radius: 50px;
            border: 1px solid #5a4535;
            margin: 1.5rem 0 1rem;
            width: fit-content;
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #d9b99a;
            padding: 0.6rem 1.6rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active { background: #c97b4a; color: #fff5ec; }
        .mode-btn:hover:not(.active) { background: #4a3729; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 1rem;
        }

        .card {
            background: #fdf8f0;
            border-radius: 2rem;
            padding: 1.3rem 1.2rem 1.4rem;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.5);
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            border-left: 6px solid #e8a87c;
            cursor: pointer;
            user-select: none;
            color: #3d322a;
            position: relative;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 25px 30px -12px #00000070; }
        .card::after {
            content: "🐾";
            position: absolute;
            bottom: 8px; right: 12px;
            font-size: 0.9rem;
            opacity: 0.15;
            transform: rotate(15deg);
        }
        .card.revealed { border-left-color: #b8825a; background: #f9f4e6; }

        .word {
            font-size: 1.25rem;
            font-weight: 600;
            color: #4a3828;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hint {
            font-size: 0.8rem;
            color: #9a7f68;
            margin-top: 0.3rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .hint::before { content: "🐱 "; }
        .card.revealed .hint::before { content: "😺 "; }

        .answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s, padding 0.2s, margin 0.2s;
            opacity: 0;
            font-size: 0.93rem;
            line-height: 1.5;
            background: #f3e8da;
            border-radius: 1.2rem;
            padding: 0 0.8rem;
        }
        .card.revealed .answer {
            padding: 0.7rem 0.8rem;
            margin-top: 0.6rem;
            opacity: 1;
            max-height: 300px;
        }
        .answer p {
            background: #ece0d2;
            padding: 0.5rem 0.8rem;
            border-radius: 1rem;
            color: #3d2e24;
            border: 1px solid #d9c4b0;
            margin-bottom: 0.4rem;
        }
        .example {
            font-size: 0.85rem;
            color: #7a604c;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .example::before { content: "✧ "; color: #c9a88a; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 1.2rem;
            border-top: 1px dashed #6b5240;
            padding-top: 1.2rem;
        }

        .btn {
            background: #4d3a2c;
            border: 1px solid #e8a87c;
            color: #fae6d2;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn:hover { background: #6b4f3a; transform: scale(1.02); }
        .btn.secondary { background: transparent; color: #d9b99a; }
        .btn.secondary:hover { background: #4d3a2c; }

        .quiz-panel {
            background: #332a23;
            border-radius: 2rem;
            padding: 1.5rem;
            margin-top: 1.5rem;
            border: 1px solid #7a5f48;
            display: none;
        }
        .quiz-panel.active { display: block; }

        .quiz-question {
            font-size: 1.6rem;
            color: #faecd8;
            margin-bottom: 1.2rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #8a6f58;
        }
        .quiz-question::before { content: "❓ "; opacity: 0.8; }

        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 1.5rem 0;
        }
        .quiz-option {
            background: #3f342b;
            border: 1px solid #8a6f58;
            color: #f0ddc8;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 1rem;
            flex: 1 0 200px;
            text-align: center;
        }
        .quiz-option:hover { background: #574538; border-color: #e8a87c; }
        .quiz-option.correct { background: #3c743c; border-color: #90c27a; color: white; }
        .quiz-option.wrong { background: #7a3e3e; border-color: #b87474; color: #ffe6e6; }

        .quiz-feedback {
            font-size: 1.1rem;
            margin-top: 1rem;
            color: #e8d5c0;
            min-height: 2rem;
        }
        .quiz-feedback::before { content: "🐾 "; opacity: 0.7; }

        .footer-note {
            margin-top: 1.8rem;
            text-align: center;
            color: #c9b09a;
            font-size: 0.8rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .footer-note span {
            background: #2a221d;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            color: #e8c8a8;
            border: 1px solid #5a4535;
        }

        .floating-notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #6b4f3a;
            color: #fff3e6;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            box-shadow: 0 15px 25px -8px black;
            border: 1px solid #e8a87c;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .floating-notif.show { opacity: 1; }

        @media (max-width: 750px) {
            body { padding: 0.8rem; }
            .container { padding: 1.3rem; border-radius: 2rem; }
            h1 { font-size: 1.7rem; }
            .mode-switch { width: 100%; overflow-x: auto; }
            .card-grid { grid-template-columns: 1fr; }
            .quiz-options { flex-direction: column; }
            .cat-ears { display: none; }
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <div class="cat-ears"></div>

        <div class="header-top">
            <h1>
                🐱 Warm Breeze · Cat Vocab Lab
                <span class="badge">32 expressions</span>
            </h1>
            <div class="stats-panel">
                <div class="stat-item">📚 <span class="value" id="learnedCount">0</span> learned</div>
                <div class="stat-item">🎯 <span class="value" id="quizScore">0</span> correct</div>
                <div class="stat-item">📈 <span class="value" id="streakCount">0</span> streak</div>
            </div>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" data-mode="explore">🐾 Explore & Learn</button>
            <button class="mode-btn" data-mode="quiz">🎮 Quiz Challenge</button>
        </div>

        <div id="exploreView">
            <div class="card-grid" id="cardGrid"></div>
            <div class="action-bar">
                <button class="btn" id="revealAllBtn">🔓 Reveal all cards</button>
                <button class="btn secondary" id="resetAllBtn">🔄 Reset all progress</button>
            </div>
        </div>

        <div id="quizView" class="quiz-panel">
            <div class="quiz-question" id="quizQuestion">Loading question...</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
            <div style="display:flex; gap:12px; margin-top:1rem; flex-wrap:wrap;">
                <button class="btn" id="nextQuestionBtn">⏩ Next question</button>
                <button class="btn secondary" id="resetQuizBtn">🔄 Reset quiz</button>
            </div>
        </div>

        <div class="footer-note">
            <span>🐱 click any card to reveal meaning</span>
            <span>🐾 learn & test yourself</span>
        </div>
    </div>

    <div id="notif" class="floating-notif"></div>

    <script>
        const vocabData = [
            { word: "warm breeze", def: "a gentle, mild wind", example: "A warm breeze drifted through the open window." },
            { word: "sway", def: "to move slowly and rhythmically from side to side", example: "The palm trees sway in the tropical wind." },
            { word: "breathe in", def: "to inhale deeply; to take air into the lungs", example: "Breathe in the fresh mountain air." },
            { word: "shine", def: "to reflect light; to glow brightly", example: "The sun began to shine after the rain." },
            { word: "grey clouds fill the sky", def: "a descriptive phrase for a gloomy day", example: "Grey clouds fill the sky, promising rain." },
            { word: "squash together", def: "to press tightly into a small space", example: "We had to squash together in the back seat." },
            { word: "ache", def: "to experience a continuous dull pain", example: "My muscles ache after the long hike." },
            { word: "flat grasslands", def: "wide, open areas of land covered in grass", example: "The savanna is full of flat grasslands." },
            { word: "beat down", def: "(of the sun) to shine very strongly and hotly", example: "The sun beat down on the desert." },
            { word: "cloudless sky", def: "a sky with no clouds; completely clear", example: "Under a cloudless sky, the stars were brilliant." },
            { word: "cicadas", def: "insects that make a loud, high-pitched buzzing sound in hot weather", example: "The cicadas sang all through the summer night." },
            { word: "fill my nostrils", def: "to describe a very strong smell entering your nose", example: "The scent of jasmine filled my nostrils." },
            { word: "when you least expect it", def: "when you are not anticipating or planning for something", example: "Happiness arrives when you least expect it." },
            { word: "end up in", def: "to finally arrive somewhere, usually without planning to", example: "We got lost and ended up in a tiny village." },
            { word: "just for an instant", def: "for a very short moment", example: "Just for an instant, I thought I saw a deer." },
            { word: "like books on a shelf", def: "a simile used to describe people packed tightly together", example: "The commuters stood like books on a shelf." },
            { word: "feel a bit numb", def: "to feel emotionally empty or unable to feel anything", example: "After the news, I felt a bit numb." },
            { word: "be grateful for", def: "to feel thankful for something", example: "I am grateful for your kindness." },
            { word: "take my breath away", def: "an idiom meaning something was incredibly beautiful or amazing", example: "The view from the cliff took my breath away." },
            { word: "bustling", def: "a word to describe a very busy, active place", example: "The bustling market was full of colors and noise." },
            { word: "sway like dancers", def: "to move gracefully like a dancer", example: "The flowers sway like dancers in the breeze." },
            { word: "be squashed together like books on a shelf", def: "to be packed very tightly", example: "In the elevator we were squashed together like books on a shelf." },
            { word: "feel like being roasted in an oven", def: "to feel extremely hot", example: "Without air conditioning, I felt like being roasted in an oven." },
            { word: "cicadas sing", def: "personification of insects making noise", example: "The cicadas sing in the heat of July." },
            { word: "happiness happens when", def: "starting a general statement about a concept", example: "Happiness happens when you stop comparing yourself." },
            { word: "believe that", def: "to express a personal opinion", example: "I believe that kindness changes the world." },
            { word: "as the train comes into", def: "setting a scene with simultaneous actions", example: "As the train comes into the station, people gather their bags." },
            { word: "realise at that moment that", def: "to express a sudden realization", example: "I realise at that moment that I forgot my keys." },
            { word: "think about things to be grateful for", def: "to list things you are thankful for", example: "Every night, think about things to be grateful for." },
            { word: "how can you not be happy in a place like this", def: "using a rhetorical question to express emotion", example: "With such beauty, how can you not be happy in a place like this?" },
            { word: "cicadas (buzzing)", def: "insects that make a loud, high-pitched buzzing sound in hot weather", example: "The cicadas' buzz is the soundtrack of summer." },
            { word: "warm breeze (soft wind)", def: "a gentle, mild wind", example: "The warm breeze carried the scent of pine." }
        ];

        let learnedSet = new Set();
        let quizScore = 0;
        let streak = 0;
        let currentQuestion = null;
        let currentCorrectIndex = -1;
        let quizAnswered = false;

        const cardGrid = document.getElementById('cardGrid');
        const learnedCountSpan = document.getElementById('learnedCount');
        const quizScoreSpan = document.getElementById('quizScore');
        const streakSpan = document.getElementById('streakCount');
        const exploreView = document.getElementById('exploreView');
        const quizView = document.getElementById('quizView');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const notif = document.getElementById('notif');

        function showNotification(msg, duration = 2000) {
            notif.textContent = msg;
            notif.classList.add('show');
            clearTimeout(notif._timer);
            notif._timer = setTimeout(() => notif.classList.remove('show'), duration);
        }

        function updateStatsUI() {
            learnedCountSpan.textContent = learnedSet.size;
            quizScoreSpan.textContent = quizScore;
            streakSpan.textContent = streak;
        }

        function renderCards() {
            cardGrid.innerHTML = '';
            vocabData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                if (learnedSet.has(index)) card.classList.add('revealed');

                let emoji = '🐈';
                if (item.word.includes('sun') || item.word.includes('shine') || item.word.includes('beat')) emoji = '☀️';
                else if (item.word.includes('cicada')) emoji = '🦗';
                else if (item.word.includes('cloud')) emoji = '☁️';
                else if (item.word.includes('breeze') || item.word.includes('sway')) emoji = '🍃';
                else if (item.word.includes('breath')) emoji = '💨';
                else if (item.word.includes('grateful') || item.word.includes('happiness')) emoji = '😺';
                else if (item.word.includes('book')) emoji = '📚';
                else if (item.word.includes('train')) emoji = '🚆';
                else if (item.word.includes('bustling')) emoji = '🏙️';
                else if (item.word.includes('oven') || item.word.includes('roasted')) emoji = '🔥';
                else if (item.word.includes('ache') || item.word.includes('numb')) emoji = '💭';
                else if (item.word.includes('grass')) emoji = '🌾';

                card.innerHTML =
                    '<div class="word">' + emoji + ' ' + item.word + '</div>' +
                    '<div class="hint">click to reveal meaning</div>' +
                    '<div class="answer"><p>' + item.def + '</p><div class="example">' + item.example + '</div></div>';

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(card.dataset.index);
                    if (card.classList.contains('revealed')) {
                        card.classList.remove('revealed');
                        learnedSet.delete(idx);
                    } else {
                        card.classList.add('revealed');
                        learnedSet.add(idx);
                    }
                    updateStatsUI();
                });

                cardGrid.appendChild(card);
            });
            updateStatsUI();
        }

        function generateQuizQuestion() {
            const correctIndex = Math.floor(Math.random() * vocabData.length);
            const correctItem = vocabData[correctIndex];
            const wrongIndices = new Set();
            while (wrongIndices.size < 3) {
                const rand = Math.floor(Math.random() * vocabData.length);
                if (rand !== correctIndex) wrongIndices.add(rand);
            }
            const options = [correctItem.def];
            wrongIndices.forEach(i => options.push(vocabData[i].def));
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            currentQuestion = { word: correctItem.word, options: options };
            currentCorrectIndex = options.indexOf(correctItem.def);
            quizAnswered = false;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            if (!currentQuestion) return;
            document.getElementById('quizQuestion').innerHTML = 'What does "<strong>' + currentQuestion.word + '</strong>" mean?';
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'quiz-option';
                btn.textContent = opt;
                btn.addEventListener('click', () => handleQuizAnswer(idx));
                optionsDiv.appendChild(btn);
            });
            document.getElementById('quizFeedback').textContent = '';
            quizAnswered = false;
        }

        function handleQuizAnswer(selectedIdx) {
            if (quizAnswered) return;
            quizAnswered = true;
            const options = document.querySelectorAll('.quiz-option');
            const isCorrect = (selectedIdx === currentCorrectIndex);
            options.forEach((opt, idx) => {
                if (idx === currentCorrectIndex) opt.classList.add('correct');
                else if (idx === selectedIdx && !isCorrect) opt.classList.add('wrong');
            });
            if (isCorrect) {
                quizScore++;
                streak++;
                document.getElementById('quizFeedback').innerHTML = '✅ Correct! Great job, little cat.';
                showNotification('🐾 Correct! Streak: ' + streak);
            } else {
                streak = 0;
                document.getElementById('quizFeedback').innerHTML = '❌ Oops! The correct definition is highlighted.';
                showNotification('😿 Not quite. Keep going!');
            }
            updateStatsUI();
        }

        function setMode(mode) {
            modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
            if (mode === 'explore') {
                exploreView.style.display = 'block';
                quizView.classList.remove('active');
                quizView.style.display = 'none';
            } else {
                exploreView.style.display = 'none';
                quizView.style.display = 'block';
                quizView.classList.add('active');
                if (!currentQuestion) generateQuizQuestion();
            }
        }

        modeBtns.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
        document.getElementById('revealAllBtn').addEventListener('click', () => {
            vocabData.forEach((_, idx) => learnedSet.add(idx));
            renderCards();
            showNotification('🐱✨ All cards revealed!');
        });
        document.getElementById('resetAllBtn').addEventListener('click', () => {
            learnedSet.clear();
            renderCards();
            showNotification('🐾 All cards reset.');
        });
        document.getElementById('nextQuestionBtn').addEventListener('click', generateQuizQuestion);
        document.getElementById('resetQuizBtn').addEventListener('click', () => {
            quizScore = 0;
            streak = 0;
            updateStatsUI();
            generateQuizQuestion();
            showNotification('🔄 Quiz reset. New question!');
        });

        renderCards();
        generateQuizQuestion();
        updateStatsUI();
        setMode('explore');
    </script>
</body>
</html>
