<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форсайт-квест: Будущее образования с ИИ</title>
<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --indigo:#4f46e5; --indigo-d:#4338ca;
    --teal:#0d9488; --amber:#f59e0b; --rose:#e11d48;
    --green:#16a34a; --red:#dc2626;
    --bg:#f8fafc; --card:#ffffff;
    --shadow:0 10px 30px -12px rgba(15,23,42,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 45%,#ecfeff 100%);
    color:var(--ink);line-height:1.55;min-height:100vh;
    padding:24px 14px 60px;
  }
  .wrap{max-width:880px;margin:0 auto}

  /* Header */
  header{text-align:center;margin-bottom:24px}
  .badge-top{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--indigo);
    background:#e0e7ff;padding:7px 16px;border-radius:99px;margin-bottom:14px;
  }
  header h1{
    font-size:30px;line-height:1.15;margin-bottom:8px;
    background:linear-gradient(120deg,var(--indigo),var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);font-size:15px;max-width:640px;margin:0 auto}

  /* Level map */
  .level-map{
    display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
    margin:22px 0 24px;
  }
  .level-node{
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;color:var(--muted);
    background:#fff;border:1.5px solid var(--line);
    padding:9px 14px;border-radius:99px;transition:.25s;
  }
  .level-node.active{
    color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-d));
    border-color:transparent;box-shadow:0 8px 20px -8px rgba(79,70,229,.7);
    transform:scale(1.05);
  }
  .level-node.done{color:var(--teal);border-color:#99f6e4;background:#f0fdfa}
  .level-node.locked{opacity:.5}
  .level-node .ln-ico{font-size:16px}
  .level-node .ln-num{
    width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    background:var(--line);color:var(--muted);font-size:11px;font-weight:800;
  }
  .level-node.active .ln-num{background:rgba(255,255,255,.25);color:#fff}
  .level-node.done .ln-num{background:#ccfbf1;color:var(--teal)}

  /* Progress */
  .pbar-wrap{margin-bottom:22px}
  .pbar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:8px}
  .pbar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--teal));transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pbar-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted)}

  /* Cards */
  .card{
    background:var(--card);border-radius:20px;padding:26px;
    box-shadow:var(--shadow);border:1px solid var(--line);
    margin-bottom:20px;animation:fade .4s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .card h2{font-size:21px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .card h2 .ico{font-size:24px}
  .card .sub{color:var(--muted);font-size:14px;margin-bottom:18px}

  /* Article block */
  .article-box{
    background:#f1f5f9;border-left:5px solid var(--indigo);
    border-radius:12px;padding:16px 18px;margin:14px 0;font-size:14px;
  }
  .article-box .label{
    font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--indigo);margin-bottom:6px;
  }
  .article-box p{margin-bottom:8px;color:#334155}
  .article-box p:last-child{margin-bottom:0}
  .article-box strong{color:var(--indigo-d)}

  .quote{
    font-style:italic;color:var(--muted);
    border-left:3px solid var(--amber);padding-left:14px;margin:12px 0;font-size:13.5px;
  }

  /* Question */
  .q-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .q-badge{
    font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--indigo);background:#e0e7ff;padding:6px 12px;border-radius:99px;
  }
  .q-type{font-size:12px;font-weight:700;color:var(--muted)}
  .q-emoji{font-size:40px;line-height:1;margin-bottom:8px}
  .q-text{font-size:18px;line-height:1.45;font-weight:800;margin-bottom:18px}

  .options{display:flex;flex-direction:column;gap:10px}
  .option{
    position:relative;display:flex;align-items:center;gap:12px;width:100%;
    text-align:left;font:inherit;font-size:15px;font-weight:600;color:var(--ink);
    padding:13px 15px;border-radius:14px;border:2px solid #e2e8f0;background:#fff;
    cursor:pointer;transition:.15s;
  }
  .option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--indigo);box-shadow:0 8px 18px -12px rgba(79,70,229,.6)}
  .option .letter{
    width:26px;height:26px;flex:0 0 26px;border-radius:8px;
    background:#f1f5f9;color:#94a3b8;display:grid;place-items:center;
    font-size:12px;font-weight:800;transition:.2s;
  }
  .option.correct{border-color:var(--green);background:#f0fdf4;color:#14532d}
  .option.correct .letter{background:var(--green);color:#fff}
  .option.wrong{border-color:var(--red);background:#fef2f2;color:#7f1d1d}
  .option.wrong .letter{background:var(--red);color:#fff}
  .option:disabled{cursor:default}

  /* Multi-check */
  .option.check .box{
    width:22px;height:22px;flex:0 0 22px;border-radius:7px;
    border:2px solid #cbd5e1;position:relative;transition:.15s;
  }
  .option.check.selected{border-color:var(--indigo);background:#eef2ff}
  .option.check.selected .box{background:var(--indigo);border-color:var(--indigo)}
  .option.check.selected .box::after{
    content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:12px;font-weight:800;
  }

  /* TF row */
  .tf-row{display:flex;gap:12px}
  .tf-row .option{justify-content:center;font-size:16px;padding:16px 10px}
  .tf-emoji{font-size:19px}

  /* Feedback */
  .feedback{
    margin-top:14px;padding:14px 16px;border-radius:14px;border-left:5px solid var(--indigo);
    background:#f8fafc;animation:fade .3s ease;font-size:14px;
  }
  .feedback.ok{background:#f0fdf4;border-left-color:var(--green)}
  .feedback.bad{background:#fef2f2;border-left-color:var(--red)}
  .fb-head{font-size:16px;font-weight:900;margin-bottom:5px}
  .feedback.ok .fb-head{color:#15803d}
  .feedback.bad .fb-head{color:#b91c1c}
  .fb-expl{line-height:1.55;color:#475569;margin-bottom:10px}
  .fb-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .fb-points{font-size:14px;font-weight:900;color:var(--indigo-d)}

  /* Buttons */
  .btn{
    font:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:none;border-radius:14px;padding:13px 24px;
    color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-d));
    box-shadow:0 10px 22px -10px rgba(79,70,229,.8);
    transition:.18s;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(79,70,229,.9)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.teal{background:linear-gradient(135deg,var(--teal),#0f766e);box-shadow:0 10px 22px -10px rgba(13,148,136,.8)}
  .btn.ghost{background:#fff;color:var(--indigo);border:2px solid #c7d2fe;box-shadow:none}
  .btn.ghost:hover{background:#eef2ff;box-shadow:none}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}

  /* Level intro */
  .level-hero{text-align:center;padding:10px 0}
  .level-hero .lh-ico{font-size:64px;line-height:1;margin-bottom:12px;animation:bounce 2.2s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .level-hero h2{justify-content:center;font-size:24px;margin-bottom:8px}
  .level-hero p{color:var(--muted);font-size:14.5px;max-width:520px;margin:0 auto 16px}

  /* Result */
  .result-emoji{font-size:64px;line-height:1;margin-bottom:10px}
  .result-title{
    font-size:24px;margin-bottom:6px;
    background:linear-gradient(120deg,var(--indigo),var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .result-score{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .score-big{font-size:42px;font-weight:900;color:var(--indigo-d);line-height:1;margin-bottom:14px;font-variant-numeric:tabular-nums}

  /* Diploma */
  #diploma{
    position:relative;max-width:720px;margin:0 auto;
    background:#fffdf7;color:#3a2a20;
    border:3px solid #c9a227;border-radius:16px;
    padding:30px 26px 20px;text-align:center;
    font-family:Georgia,'Times New Roman',serif;
    box-shadow:0 30px 60px -30px rgba(120,80,20,.55),0 0 0 8px #fffdf7,0 0 0 10px #e8cf8a;
  }
  #diploma::before{content:"";position:absolute;inset:10px;border:1px solid #e3cd93;border-radius:10px;pointer-events:none}
  .dip-corner{position:absolute;font-size:18px;opacity:.4}
  .dip-corner.tl{top:12px;left:16px}.dip-corner.tr{top:12px;right:16px}
  .dip-corner.bl{bottom:12px;left:16px}.dip-corner.br{bottom:12px;right:16px}
  .dip-academy{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#8a6d1f;margin-bottom:4px}
  .dip-title{font-size:40px;letter-spacing:.14em;color:#a8741a;font-weight:700;line-height:1.1}
  .dip-sub{font-style:italic;font-size:13.5px;color:#7b6a5a;margin-top:4px}
  .dip-name{
    display:inline-block;font-family:'Segoe Script','Brush Script MT',cursive;
    font-size:32px;color:#6b3fa0;margin:12px 0 6px;padding:0 16px 4px;
    border-bottom:1px dashed #d9c69a;line-height:1.25;
  }
  .dip-text{font-size:14px;line-height:1.6;color:#4b3a2e}
  .dip-rank{
    display:inline-block;margin:12px auto 4px;padding:7px 20px;border-radius:99px;
    background:linear-gradient(135deg,#fff3d6,#ffe1a8);border:1px solid #e3c37a;
    font-size:16px;font-weight:700;color:#8a5a00;
  }
  .dip-stats{display:flex;justify-content:center;gap:24px;margin:14px 0 6px;flex-wrap:wrap}
  .dip-stats div span{display:block;font-family:'Segoe UI',sans-serif;font-size:22px;font-weight:800;color:#a8741a;line-height:1.1}
  .dip-stats div small{display:block;font-family:'Segoe UI',sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#9a8a78;margin-top:3px}
  .dip-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:#6d5b4b;text-align:left}
  .dip-seal{font-size:28px;line-height:1;color:#a8741a;text-align:center}
  .dip-seal small{display:block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#9a8a78;margin-top:3px}
  .dip-sign{text-align:right}.dip-sign b{display:block;margin-top:3px;font-size:13px}
  .dip-no{margin-top:12px;font-size:11px;letter-spacing:.08em;color:#9a8a78}

  /* Name input */
  .name-box{max-width:360px;margin:0 auto;text-align:left}
  .name-box label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .name-box input{
    width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--ink);
    padding:13px 15px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;transition:.2s;
  }
  .name-box input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
  .error{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin:5px 0 2px}

  .hidden{display:none!important}

  /* Print */
  @media print{
    @page{size:A4 landscape;margin:10mm}
    body{background:#fff;padding:0;display:block}
    body *{visibility:hidden}
    #diploma,#diploma *{visibility:visible}
    #diploma{position:absolute;left:0;top:0;width:100%;margin:0;box-shadow:none;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .no-print{display:none!important}
  }

  @media(max-width:520px){
    header h1{font-size:23px}
    .card{padding:18px 15px}
    .q-text{font-size:16px}
    .option{font-size:14px;padding:12px 12px}
    .dip-title{font-size:30px}
    .dip-name{font-size:26px}
    #diploma{padding:22px 14px 16px}
    .level-node{padding:7px 10px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="no-print">
    <div class="badge-top">Технология Форсайт · Квест с уровнями</div>
    <h1>Будущее образования с искусственным интеллектом</h1>
    <p>Пройдите 4 уровня, отвечая на вопросы по методике Сысоева и Филатова (2024). В конце — именной диплом.</p>
  </header>

  <div class="level-map no-print" id="levelMap"></div>
  <div class="pbar-wrap no-print" id="pbarWrap">
    <div class="pbar"><div class="pbar-fill" id="pbarFill"></div></div>
    <div class="pbar-labels">
      <span id="pbarLevel">Уровень 1</span>
      <span id="pbarScore">⭐ 0 очков</span>
    </div>
  </div>

  <main id="app"></main>
</div>

<script>
/* =========================================================
   УРОВНИ И ВОПРОСЫ
   ========================================================= */
const LEVELS = [
  {
    id: 1, ico: '📖', title: 'Уровень 1. Введение в триаду',
    desc: 'Проверьте, как вы поняли ключевую идею статьи: ИИ не заменяет преподавателя, а дополняет его.',
    questions: [
      {
        type: 'single',
        q: 'Что представляет собой триада, предлагаемая авторами статьи как новая парадигма образования?',
        options: [
          '«обучающийся — преподаватель — искусственный интеллект»',
          '«обучающийся — учебник — компьютер»',
          '«преподаватель — администрация — ИИ»',
          '«ИИ — нейросеть — чат-бот»'
        ],
        correct: 0,
        expl: 'Авторы предлагают триаду «обучающийся — преподаватель — искусственный интеллект», где ИИ — дополнительный третий субъект образовательного процесса.'
      },
      {
        type: 'tf',
        q: 'Согласно статье, искусственный интеллект полностью заменяет преподавателя в процессе обучения.',
        correct: false,
        expl: 'Нет. Преподаватель не исключается из процесса: традиционная методика обогащается дополнительными этапами взаимодействия с ИИ.'
      },
      {
        type: 'single',
        q: 'Какие две новые для практики преподавания аспекта особо выделяют авторы?',
        options: [
          'Скорость интернета и мощность компьютеров',
          'Соблюдение авторской этики и обсуждение результатов взаимодействия с ИИ в аудитории',
          'Запрет ИИ и возврат к бумажным работам',
          'Использование только Grammarly'
        ],
        correct: 1,
        expl: 'Авторы акцентируют: а) соблюдение норм авторской этики при получении обратной связи от ИИ; б) необходимость обсуждения результатов взаимодействия с ИИ во время аудиторных занятий.'
      }
    ]
  },
  {
    id: 2, ico: '🎛️', title: 'Уровень 2. Роли и этика',
    desc: 'Разберитесь, какие функции берёт на себя ИИ и что остаётся за преподавателем и обучающимся.',
    questions: [
      {
        type: 'multi',
        q: 'Какие преимущества интеграции ИИ в обучение письменной речи выделяют авторы?',
        options: [
          'Снижение страха обучающихся совершить ошибку перед преподавателем',
          'Мгновенная проверка письменных творческих работ',
          'Предоставление количественной и качественной обратной связи',
          'Полная отмена необходимости учиться писать самостоятельно'
        ],
        correct: [0, 1, 2],
        expl: 'Авторы называют три преимущества: снижение страха ошибки, мгновенная проверка и обратная связь (баллы + комментарии). Отмену самостоятельного письма они не предлагают.'
      },
      {
        type: 'single',
        q: 'Какая проблема в академической среде связана с использованием ИИ и вызывает особую тревогу?',
        options: [
          'Слишком высокая стоимость ИИ-инструментов',
          'Несоблюдение обучающимися норм авторской этики (плагиат, выдача сгенерированных текстов за свои)',
          'Отсутствие интернета в аудиториях',
          'Слишком медленная работа ChatGPT'
        ],
        correct: 1,
        expl: 'Ключевая проблема — авторская этика: обучающиеся могут выдавать сгенерированные ИИ тексты за свои. Авторы предлагают не запрет, а обучение разумному использованию ИИ.'
      },
      {
        type: 'tf',
        q: 'Авторы считают, что запрет на использование ИИ в образовательном процессе решает проблему плагиата.',
        correct: false,
        expl: 'Нет. Авторы прямо пишут: запрет «не ведёт к решению проблемы, а где-то усугубляет её». Решение — в создании комплексной методики с этапами анализа ИИ-эссе.'
      }
    ]
  },
  {
    id: 3, ico: '🧩', title: 'Уровень 3. 11 этапов методики',
    desc: 'Проверьте знание последовательности обучения письму в триаде «обучающийся — преподаватель — ИИ».',
    questions: [
      {
        type: 'single',
        q: 'Чем посвящён второй этап методики?',
        options: [
          'Написанием финального эссе',
          'Погружением обучающихся в проектную деятельность по использованию конкретного ИИ-инструмента',
          'Рефлексией',
          'Печатью диплома'
        ],
        correct: 1,
        expl: 'Второй этап — погружение в проект: преподаватель объясняет цель, этапы работы, ожидаемый результат и критерии оценки.'
      },
      {
        type: 'multi',
        q: 'Что происходит на шестом и девятом этапах (аудиторная работа)?',
        options: [
          'Анализ и обсуждение сгенерированных ИИ работ в малых группах',
          'Обсуждение, какие изменения предложил ИИ и почему',
          'Аргументация использования или неиспользования рекомендаций ИИ',
          'Полный запрет ИИ'
        ],
        correct: [0, 1, 2],
        expl: 'Шестой этап — анализ и обсуждение сгенерированных ИИ эссе. Девятый — обсуждение рекомендаций ИИ и аргументация их использования. Запрет ИИ методика не предполагает.'
      },
      {
        type: 'tf',
        q: 'Аудиторная работа с обратной связью от ИИ (этапы 6 и 9) служит контролем самостоятельного внеаудиторного взаимодействия с ИИ (этапы 5 и 8).',
        correct: true,
        expl: 'Верно. Авторы подчёркивают: аудиторная работа с обратной связью — это контроль и подтверждение самостоятельного внеаудиторного взаимодействия обучающихся с ИИ.'
      },
      {
        type: 'single',
        q: 'На каком этапе обучающиеся пишут собственное эссе с учётом опыта взаимодействия с ИИ?',
        options: ['На третьем', 'На пятом', 'На седьмом', 'На одиннадцатом'],
        correct: 2,
        expl: 'Седьмой этап — написание обучающимися собственного эссе по теме с учётом опыта взаимодействия с ИИ.'
      }
    ]
  },
  {
    id: 4, ico: '🚀', title: 'Уровень 4. Будущее и выводы',
    desc: 'Финальный уровень: осмыслите перспективы и главные выводы статьи.',
    questions: [
      {
        type: 'single',
        q: 'Какой ИИ-инструмент авторы называют наиболее совершенным для предоставления качественной обратной связи?',
        options: ['Grammarly', 'PaperRater', 'ChatGPT', 'Google Translate'],
        correct: 2,
        expl: 'Авторы отмечают: из всех доступных ИИ-инструментов ChatGPT от OpenAI — наиболее совершенный, способный давать обратную связь по широкому спектру критериев, включая содержание.'
      },
      {
        type: 'tf',
        q: 'По мнению авторов, ИИ уже полностью и безошибочно оценивает глубину содержания письменных работ.',
        correct: false,
        expl: 'Нет. Содержание — единственный критерий, вызывающий дискуссии: критики считают, что ИИ оценивает содержание лишь по формальным признакам (разнообразие лексики, когезия).'
      },
      {
        type: 'multi',
        q: 'Какие выводы о будущем образования с ИИ соответствуют статье?',
        options: [
          'Триада обогащает традиционную методику новыми возможностями',
          'Преподаватель сохраняет функции обучения и оценки',
          'Необходимо обсуждать результаты взаимодействия с ИИ в аудитории',
          'ИИ должен полностью заменить преподавателя'
        ],
        correct: [0, 1, 2],
        expl: 'Авторы подчёркивают: триада обогащает методику, преподаватель сохраняет функции, аудиторное обсуждение обязательно. Полной замены преподавателя ИИ не предполагается.'
      },
      {
        type: 'single',
        q: 'В чём главная идея статьи о роли ИИ в образовании?',
        options: [
          'ИИ должен быть запрещён в школах и вузах',
          'ИИ дополняет преподавателя, а не заменяет его, в рамках триады',
          'ИИ нужен только для перевода текстов',
          'ИИ полностью заменит все учебники'
        ],
        correct: 1,
        expl: 'Главная идея: ИИ встраивается в традиционную методику как дополнительный субъект триады, обогащая процесс, но не заменяя преподавателя.'
      }
    ]
  }
];

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
const state = {
  name: '',
  level: 0,          // индекс текущего уровня
  qIndex: 0,         // индекс вопроса внутри уровня
  score: 0,
  totalCorrect: 0,
  totalQuestions: 0,
  unlocked: new Set([0]),
  completed: new Set(),
  locked: false
};

const app = document.getElementById('app');
const levelMap = document.getElementById('levelMap');
const pbarFill = document.getElementById('pbarFill');
const pbarLevel = document.getElementById('pbarLevel');
const pbarScore = document.getElementById('pbarScore');
const pbarWrap = document.getElementById('pbarWrap');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   КАРТА УРОВНЕЙ
   ========================================================= */
function renderLevelMap(){
  levelMap.innerHTML = LEVELS.map((lv, i) => {
    let cls = 'level-node';
    if (i === state.level) cls += ' active';
    else if (state.completed.has(i)) cls += ' done';
    else if (!state.unlocked.has(i)) cls += ' locked';
    const num = state.completed.has(i) ? '✓' : (i + 1);
    return `<div class="${cls}"><span class="ln-ico">${lv.ico}</span><span class="ln-num">${num}</span>${lv.title.split('.')[0]}</div>`;
  }).join('');
}

function updateProgress(){
  const totalQ = LEVELS.reduce((s, l) => s + l.questions.length, 0);
  const doneQ = LEVELS.slice(0, state.level).reduce((s, l) => s + l.questions.length, 0) + state.qIndex;
  const pct = (doneQ / totalQ) * 100;
  pbarFill.style.width = pct + '%';
  pbarLevel.textContent = 'Уровень ' + (state.level + 1) + ' из ' + LEVELS.length;
  pbarScore.textContent = '⭐ ' + state.score + ' очков';
}

/* =========================================================
   СТАРТ
   ========================================================= */
function showStart(){
  levelMap.innerHTML = '';
  pbarWrap.classList.add('hidden');
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:64px;line-height:1;margin-bottom:10px;animation:bounce 2.2s ease-in-out infinite">🎓</div>
      <h2 style="justify-content:center"><span class="ico">🚀</span> Форсайт-квест с уровнями</h2>
      <p class="sub" style="max-width:520px;margin:0 auto 18px">
        Вас ждут <b>4 уровня</b> и <b>13 вопросов</b> по статье Сысоева и Филатова (2024).
        Пройдите уровень, чтобы открыть следующий. В конце — именной диплом!
      </p>
      <div class="name-box">
        <label for="nameInput">Как вас зовут? (имя попадёт в диплом)</label>
        <input id="nameInput" type="text" maxlength="30" placeholder="Например, Анна" autocomplete="off">
        <div class="error" id="nameError"></div>
        <button class="btn" id="startBtn" style="width:100%;margin-top:6px">Начать квест 🐾</button>
      </div>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px">
        <span style="font-size:12px;font-weight:700;color:#8a6a4e;background:#fff4e6;border:1px solid #f3ddc2;padding:6px 11px;border-radius:99px">📖 4 уровня</span>
        <span style="font-size:12px;font-weight:700;color:#8a6a4e;background:#fff4e6;border:1px solid #f3ddc2;padding:6px 11px;border-radius:99px">❓ 13 вопросов</span>
        <span style="font-size:12px;font-weight:700;color:#8a6a4e;background:#fff4e6;border:1px solid #f3ddc2;padding:6px 11px;border-radius:99px">🎓 диплом</span>
      </div>
    </div>
  `;
  const input = document.getElementById('nameInput');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  const err = document.getElementById('nameError');
  if (name.length < 2){
    err.textContent = 'Введите имя (минимум 2 символа)';
    input.style.borderColor = 'var(--red)';
    return;
  }
  state.name = name;
  state.level = 0;
  state.qIndex = 0;
  state.score = 0;
  state.totalCorrect = 0;
  state.totalQuestions = 0;
  state.unlocked = new Set([0]);
  state.completed = new Set();
  pbarWrap.classList.remove('hidden');
  showLevelIntro();
}

/* =========================================================
   ИНТРО УРОВНЯ
   ========================================================= */
function showLevelIntro(){
  const lv = LEVELS[state.level];
  state.qIndex = 0;
  renderLevelMap();
  updateProgress();
  app.innerHTML = `
    <div class="card level-hero">
      <div class="lh-ico">${lv.ico}</div>
      <h2>${lv.title}</h2>
      <p>${lv.desc}</p>
      <button class="btn" id="startLevelBtn">Начать уровень →</button>
    </div>
  `;
  document.getElementById('startLevelBtn').addEventListener('click', showQuestion);
}

/* =========================================================
   ВОПРОС
   ========================================================= */
function showQuestion(){
  state.locked = false;
  const lv = LEVELS[state.level];
  const q = lv.questions[state.qIndex];
  const n = state.qIndex + 1;
  const total = lv.questions.length;

  renderLevelMap();
  updateProgress();

  const typeLabel = {
    single: 'Выберите один ответ',
    multi: 'Выберите все верные варианты',
    tf: 'Верно или неверно?'
  }[q.type];

  let inner = `
    <div class="q-meta">
      <span class="q-badge">Вопрос ${n} из ${total}</span>
      <span class="q-type">${typeLabel}</span>
    </div>
    <h2 class="q-text">${q.q}</h2>`;

  if (q.type === 'single'){
    inner += `<div class="options">` + q.options.map((o,i) =>
      `<button class="option" data-i="${i}">
         <span class="letter">${'ABCD'[i]}</span><span>${o}</span>
       </button>`).join('') + `</div>`;
  }

  if (q.type === 'multi'){
    inner += `<div class="options">` + q.options.map((o,i) =>
      `<button class="option check" data-i="${i}">
         <span class="box"></span><span>${o}</span>
       </button>`).join('') + `</div>
      <button class="btn" id="submitBtn" disabled style="margin-top:14px">Ответить</button>`;
  }

  if (q.type === 'tf'){
    inner += `<div class="tf-row">
      <button class="option tf" data-v="true"><span class="tf-emoji">✅</span>Верно</button>
      <button class="option tf" data-v="false"><span class="tf-emoji">❌</span>Неверно</button>
    </div>`;
  }

  inner += `<div id="feedback"></div>`;
  app.innerHTML = `<div class="card">${inner}</div>`;

  /* Обработчики */
  if (q.type === 'single'){
    app.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => { if (!state.locked) checkSingle(Number(btn.dataset.i)); });
    });
  }
  if (q.type === 'multi'){
    app.querySelectorAll('.option.check').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.locked) return;
        btn.classList.toggle('selected');
        document.getElementById('submitBtn').disabled =
          app.querySelectorAll('.option.check.selected').length === 0;
      });
    });
    document.getElementById('submitBtn').addEventListener('click', checkMulti);
  }
  if (q.type === 'tf'){
    app.querySelectorAll('.option.tf').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!state.locked) checkTF(btn.dataset.v === 'true');
      });
    });
  }
}

/* =========================================================
   ПРОВЕРКА
   ========================================================= */
function checkSingle(i){
  const q = LEVELS[state.level].questions[state.qIndex];
  state.locked = true;
  app.querySelectorAll('.option').forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) b.classList.add('correct');
    if (idx === i && i !== q.correct) b.classList.add('wrong');
  });
  award(i === q.correct, q, i === q.correct ? 100 : 0);
}

function checkTF(val){
  const q = LEVELS[state.level].questions[state.qIndex];
  state.locked = true;
  app.querySelectorAll('.option.tf').forEach(b => {
    b.disabled = true;
    const isTrue = b.dataset.v === 'true';
    if (isTrue === q.correct) b.classList.add('correct');
    if (isTrue === val && val !== q.correct) b.classList.add('wrong');
  });
  award(val === q.correct, q, val === q.correct ? 100 : 0);
}

function checkMulti(){
  if (state.locked) return;
  const q = LEVELS[state.level].questions[state.qIndex];
  state.locked = true;
  const selected = [...app.querySelectorAll('.option.check.selected')]
    .map(b => Number(b.dataset.i)).sort((a,b) => a - b);
  const correct = [...q.correct].sort((a,b) => a - b);
  const ok = selected.length === correct.length && selected.every((v,i) => v === correct[i]);

  app.querySelectorAll('.option.check').forEach((b, idx) => {
    b.disabled = true;
    b.classList.remove('selected');
    if (q.correct.includes(idx)) b.classList.add('correct');
    else if (selected.includes(idx)) b.classList.add('wrong');
  });
  award(ok, q, ok ? 150 : 0);
}

/* =========================================================
   ИТОГ ВОПРОСА
   ========================================================= */
function award(ok, q, points){
  if (ok) state.totalCorrect++;
  state.totalQuestions++;
  state.score += points;

  const isLastQ = state.qIndex === LEVELS[state.level].questions.length - 1;
  const fb = document.getElementById('feedback');
  fb.innerHTML = `
    <div class="feedback ${ok ? 'ok' : 'bad'}">
      <div class="fb-head">${ok ? '✅ Верно!' : '❌ Неверно'}</div>
      <div class="fb-expl">${q.expl}</div>
      <div class="fb-foot">
        <span class="fb-points">${points > 0 ? '+' + points + ' очков' : '+0 очков'}</span>
        <button class="btn" id="nextBtn">${isLastQ ? 'Завершить уровень →' : 'Дальше →'}</button>
      </div>
    </div>`;
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (isLastQ) finishLevel();
    else { state.qIndex++; showQuestion(); }
  });
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* =========================================================
   ЗАВЕРШЕНИЕ УРОВНЯ
   ========================================================= */
function finishLevel(){
  state.completed.add(state.level);
  const isLastLevel = state.level === LEVELS.length - 1;

  if (isLastLevel){
    showDiploma();
    return;
  }

  const nextLevel = state.level + 1;
  state.unlocked.add(nextLevel);
  renderLevelMap();

  app.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:56px;margin-bottom:10px">🎉</div>
      <h2 style="justify-content:center"><span class="ico">✅</span> Уровень пройден!</h2>
      <p class="sub" style="margin-bottom:18px">Вы завершили уровень «${LEVELS[state.level].title}». Следующий уровень открыт!</p>
      <div style="display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px">
        <div><div style="font-size:28px;font-weight:900;color:var(--indigo-d)">${state.score}</div><div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">очков</div></div>
        <div><div style="font-size:28px;font-weight:900;color:var(--teal)">${state.totalCorrect}/${state.totalQuestions}</div><div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">верно</div></div>
      </div>
      <button class="btn" id="nextLevelBtn">Перейти на уровень ${nextLevel + 1} →</button>
    </div>
  `;
  document.getElementById('nextLevelBtn').addEventListener('click', () => {
    state.level = nextLevel;
    showLevelIntro();
  });
}

/* =========================================================
   ДИПЛОМ
   ========================================================= */
function getRank(p){
  if (p === 100) return { title: 'Магистр форсайта', emoji: '🎓' };
  if (p >= 85)   return { title: 'Эксперт по ИИ в образовании', emoji: '🏆' };
  if (p >= 70)   return { title: 'Старший аналитик', emoji: '🥇' };
  if (p >= 55)   return { title: 'Практик форсайта', emoji: '🥈' };
  if (p >= 40)   return { title: 'Участник сессии', emoji: '🥉' };
  return           { title: 'Начинающий исследователь', emoji: '🐾' };
}

function showDiploma(){
  levelMap.innerHTML = '';
  pbarWrap.classList.add('hidden');

  const totalQ = LEVELS.reduce((s, l) => s + l.questions.length, 0);
  const pct = Math.round(state.totalCorrect / totalQ * 100);
  const rank = getRank(pct);
  const date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  const no = 'ФС-' + Math.floor(100000 + Math.random() * 900000) + '/' + new Date().getFullYear();

  app.innerHTML = `
    <div class="card no-print" style="text-align:center">
      <h2 style="justify-content:center"><span class="ico">🎓</span> Все уровни пройдены!</h2>
      <p class="sub" style="margin-bottom:16px">Вот ваш именной диплом. Его можно распечатать или сохранить в PDF.</p>
    </div>

    <div id="diploma">
      <span class="dip-corner tl">🐾</span>
      <span class="dip-corner tr">🐾</span>
      <span class="dip-corner bl">🐾</span>
      <span class="dip-corner br">🐾</span>

      <div class="dip-academy">Академия форсайта · Образование с ИИ</div>
      <div class="dip-title">ДИПЛОМ</div>
      <div class="dip-sub">о прохождении форсайт-квеста «Будущее образования с ИИ»</div>

      <div class="dip-name">${esc(state.name)}</div>

      <div class="dip-text">
        успешно прошёл(ла) все 4 уровня квеста,<br>
        верно ответив на <b>${state.totalCorrect} из ${totalQ}</b> вопросов
      </div>

      <div class="dip-rank">${rank.emoji} ${rank.title}</div>

      <div class="dip-stats">
        <div><span>${pct}%</span><small>результат</small></div>
        <div><span>${state.score}</span><small>очков</small></div>
        <div><span>${state.totalCorrect}/${totalQ}</span><small>верно</small></div>
      </div>

      <div class="dip-footer">
        <div>${date}</div>
        <div class="dip-seal">🐈<small>печать академии</small></div>
        <div class="dip-sign">Ректор<br><b>Кот Учёный</b></div>
      </div>

      <div class="dip-no">Диплом № ${no}</div>
    </div>

    <div class="btn-row no-print" style="justify-content:center">
      <button class="btn" id="printBtn">🖨 Распечатать / PDF</button>
      <button class="btn ghost" id="restartBtn">🔄 Пройти заново</button>
    </div>
    <p class="no-print" style="text-align:center;font-size:13px;color:var(--muted);margin-top:10px">Совет: в окне печати выберите «Сохранить как PDF».</p>
  `;

  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('restartBtn').addEventListener('click', showStart);

  if (pct >= 60) confetti(36);
}

/* =========================================================
   КОНФЕТТИ
   ========================================================= */
function confetti(count){
  const emojis = ['🎓','⭐','✨','🏆','💡','📚'];
  for (let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.cssText = `
      position:fixed;left:${Math.random()*100}vw;top:-50px;
      font-size:${16+Math.random()*22}px;pointer-events:none;z-index:9999;
      transition:transform ${1.8+Math.random()*1.6}s linear,opacity 2.6s ease;
    `;
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transform = `translateY(${window.innerHeight+140}px) rotate(${Math.random()*720-360}deg)`;
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 3600);
  }
}

/* =========================================================
   ЗАПУСК
   ========================================================= */
showStart();
</script>
</body>
</html>
