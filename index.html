<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collocation Trainer</title>
<style>
  *{box-sizing:border-box}
  :root{
    --accent:#8b5cf6; --accent2:#22d3ee; --good:#34d399; --bad:#fb7185;
    --text:#eef0ff; --muted:#a3a7cc;
    --card:rgba(255,255,255,.055); --stroke:rgba(255,255,255,.11);
  }
  html,body{height:100%}
  body{
    margin:0; padding:0; color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1000px 600px at 10% -10%, rgba(139,92,246,.38), transparent 60%),
      radial-gradient(900px 520px at 95% 0%, rgba(34,211,238,.22), transparent 55%),
      radial-gradient(800px 600px at 50% 115%, rgba(244,114,182,.18), transparent 60%),
      linear-gradient(160deg,#0b0a1f,#150f33 45%,#0b0a1f);
    background-attachment:fixed;
    min-height:100vh;
  }
  .app{max-width:1000px;margin:0 auto;padding:28px 18px 60px}

  /* ---------- header ---------- */
  header{text-align:center;margin-bottom:22px}
  h1{
    margin:0; font-size:clamp(1.6rem,4.4vw,2.4rem); letter-spacing:-.02em;
    background:linear-gradient(100deg,#c4b5fd,#22d3ee 45%,#f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{margin:8px 0 0;color:var(--muted);font-size:.92rem}

  /* ---------- tabs ---------- */
  .tabs{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:rgba(255,255,255,.05); border:1px solid var(--stroke);
    padding:6px; border-radius:16px; margin:20px auto 26px; width:fit-content;
    backdrop-filter:blur(10px);
  }
  .tab{
    font:inherit; font-size:.92rem; font-weight:600; color:var(--muted);
    background:transparent; border:0; padding:10px 20px; border-radius:12px;
    cursor:pointer; transition:.2s; white-space:nowrap;
  }
  .tab:hover{color:var(--text);background:rgba(255,255,255,.07)}
  .tab.active{
    color:#fff; background:linear-gradient(135deg,var(--accent),#6366f1);
    box-shadow:0 8px 22px -10px rgba(139,92,246,.95);
  }

  /* ---------- shared ---------- */
  .panel{display:none; animation:fade .35s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .toolbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .bar{flex:1;min-width:120px;height:8px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
  .counter{font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}

  .btn{
    font:inherit;font-size:.88rem;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.08);border:1px solid var(--stroke);
    padding:10px 18px;border-radius:12px;cursor:pointer;transition:.18s;
    backdrop-filter:blur(8px);
  }
  .btn:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#6366f1);border-color:transparent;
    box-shadow:0 10px 26px -10px rgba(139,92,246,.95);
  }
  .btn.primary:hover{box-shadow:0 14px 32px -10px rgba(139,92,246,1)}

  /* ---------- flashcards ---------- */
  .flip-card{perspective:1400px;height:320px;margin-bottom:22px;cursor:pointer}
  .flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1)}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:32px 26px;text-align:center;border-radius:22px;
    border:1px solid var(--stroke);background:var(--card);backdrop-filter:blur(14px);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
  }
  .front{background:linear-gradient(150deg,rgba(139,92,246,.22),rgba(255,255,255,.05))}
  .back{transform:rotateY(180deg);background:linear-gradient(150deg,rgba(34,211,238,.18),rgba(255,255,255,.05));overflow:auto}
  .tag{font-size:.68rem;font-weight:800;letter-spacing:.18em;color:var(--accent2);opacity:.9}
  .face h2{margin:0;font-size:clamp(1.4rem,4vw,2.15rem);line-height:1.25;font-weight:700}
  .face p{margin:0;font-size:clamp(1rem,2.6vw,1.18rem);line-height:1.6;color:#dfe3ff;max-width:620px}
  .tip{font-size:.78rem;color:var(--muted)}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  /* ---------- quiz ---------- */
  .question{
    background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.1));
    border:1px solid rgba(255,255,255,.13);border-radius:20px;
    padding:24px 26px;margin-bottom:20px;
  }
  .qtag{font-size:.7rem;font-weight:800;letter-spacing:.16em;color:var(--muted)}
  .question h3{margin:10px 0 0;font-size:clamp(1.05rem,2.8vw,1.28rem);line-height:1.5;font-weight:600}
  .option{
    display:block;width:100%;text-align:left;font:inherit;font-size:1rem;line-height:1.45;
    color:var(--text);background:var(--card);border:1px solid var(--stroke);
    padding:15px 20px;border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.18s;
  }
  .option:hover{background:rgba(255,255,255,.1);border-color:rgba(139,92,246,.65);transform:translateX(4px)}
  .option.correct{background:rgba(52,211,153,.18);border-color:var(--good);transform:translateX(4px)}
  .option.wrong{background:rgba(251,113,133,.16);border-color:var(--bad);animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(4px)}
    25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}
  }

  .results{text-align:center;padding:26px 0 10px}
  .score-ring{
    width:150px;height:150px;margin:0 auto 20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:2.1rem;font-weight:800;
    background:radial-gradient(circle at 50% 30%,rgba(139,92,246,.35),transparent 70%),rgba(255,255,255,.06);
    border:2px solid rgba(139,92,246,.55);
    box-shadow:0 0 50px -10px rgba(139,92,246,.75);
  }
  .results .msg{font-size:1.12rem;margin:0 0 26px;color:#dfe3ff}

  /* ---------- match ---------- */
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(max-width:640px){.tiles{grid-template-columns:1fr}}
  .tile{
    display:flex;align-items:center;min-height:74px;
    background:var(--card);border:1px solid var(--stroke);border-radius:14px;
    padding:14px 18px;font-size:.95rem;line-height:1.45;cursor:pointer;
    transition:.18s;user-select:none;
  }
  .tile:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
  .tile.sel{
    border-color:var(--accent2);background:rgba(34,211,238,.12);
    box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 26px rgba(34,211,238,.28);
  }
  .tile.matched{
    border-color:var(--good);background:rgba(52,211,153,.14);
    opacity:.42;cursor:default;transform:none;
  }
  .tile.bad{border-color:var(--bad);background:rgba(251,113,133,.16);animation:shake .4s}

  .win{
    margin-top:18px;text-align:center;padding:22px;border-radius:18px;
    background:linear-gradient(135deg,rgba(52,211,153,.2),rgba(34,211,238,.14));
    border:1px solid rgba(52,211,153,.45);animation:fade .4s ease;
  }
  .win h4{margin:0 0 8px;font-size:1.25rem}
  .win p{margin:0 0 16px;color:#dfe3ff}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Collocation Trainer</h1>
    <p>40 collocations · 3 game modes · tap, guess, match!</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-mode="study">📚 Flashcards</button>
    <button class="tab" data-mode="quiz">🎯 Quiz</button>
    <button class="tab" data-mode="match">🧩 Match</button>
  </nav>

  <!-- ================= STUDY ================= -->
  <section id="panel-study" class="panel active">
    <div class="toolbar">
      <div class="bar"><i id="sBar"></i></div>
      <span class="counter" id="sCounter">1 / 40</span>
      <button class="btn" id="sShuffle">🔀 Shuffle</button>
    </div>

    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="face front">
          <span class="tag">COLLOCATION</span>
          <h2 id="sFront">take a photo</h2>
          <span class="tip">tap the card to reveal the meaning</span>
        </div>
        <div class="face back">
          <span class="tag">MEANING</span>
          <p id="sBack">to use a camera to capture an image</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="sPrev">← Prev</button>
      <button class="btn primary" id="sFlip">Flip</button>
      <button class="btn" id="sNext">Next →</button>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="panel-quiz" class="panel">
    <div class="toolbar">
      <div class="bar"><i id="qBar"></i></div>
      <span class="counter" id="qCount">Question 1 / 10</span>
      <span class="counter" id="qScore">⭐ 0</span>
    </div>
    <div id="quizBody"></div>
  </section>

  <!-- ================= MATCH ================= -->
  <section id="panel-match" class="panel">
    <div class="toolbar">
      <span class="counter" id="mMoves">Moves: 0</span>
      <div class="bar"><i id="mBar"></i></div>
      <span class="counter" id="mPairs">0 / 5 pairs</span>
      <button class="btn" id="mRestart">🔀 New set</button>
    </div>
    <div class="tiles" id="mTiles"></div>
    <div id="mWin"></div>
  </section>

</div>

<script>
/* ============ DATA ============ */
const DATA = [
  {c:"take a photo",            d:"to use a camera to capture an image"},
  {c:"take an exam",            d:"to do a test to measure knowledge or ability"},
  {c:"make a mistake",          d:"to do something incorrectly"},
  {c:"miss the point",          d:"to not understand the main idea of something"},
  {c:"miss the bus",            d:"to arrive too late to catch a bus"},
  {c:"run a business",          d:"to manage or operate a company"},
  {c:"run a race",              d:"to participate in a running competition"},
  {c:"tell the truth",          d:"to say what is true"},
  {c:"tell a story",            d:"to narrate a tale or recount events"},
  {c:"start an argument",       d:"to begin a disagreement or fight"},
  {c:"have confidence in",      d:"to trust or believe in someone or something"},
  {c:"make the most of",        d:"to use an opportunity as well as possible"},
  {c:"run the risk of",         d:"to do something that might result in a bad outcome"},
  {c:"take part in",            d:"to participate in an activity"},
  {c:"bad luck",                d:"unfortunate circumstances or outcomes"},
  {c:"good news",               d:"information that is positive or happy"},
  {c:"great success",           d:"achieving a very positive outcome"},
  {c:"great difficulty",        d:"a lot of trouble or effort"},
  {c:"heavy rain",              d:"a lot of rain falling"},
  {c:"heavy traffic",           d:"many vehicles on the road, causing slow movement"},
  {c:"heavy cold",              d:"a severe cold"},
  {c:"light rain",              d:"a small amount of rain"},
  {c:"light meal",              d:"a small, easily digestible meal"},
  {c:"strong swimmer",          d:"someone who swims well"},
  {c:"strong coffee",           d:"coffee with a potent taste (high caffeine or strong brew)"},
  {c:"speak your mind",         d:"to say exactly what you think"},
  {c:"meet your deadlines",     d:"to finish a task by the required time"},
  {c:"wait in line",            d:"to stand in a queue"},
  {c:"lose your temper",        d:"to become angry suddenly"},
  {c:"keep your promises",      d:"to do what you said you would do"},
  {c:"make your bed",           d:"to arrange the sheets and blankets neatly"},
  {c:"break the rules",         d:"to disobey regulations"},
  {c:"voice your opinion",      d:"to express your thoughts or views"},
  {c:"take charge",             d:"to take control or lead"},
  {c:"resolve the dispute",     d:"to settle a disagreement"},
  {c:"remain calm",             d:"to stay peaceful and not get upset"},
  {c:"take an interest in",     d:"to become curious or concerned about something"},
  {c:"make time for",           d:"to prioritize an activity despite being busy"},
  {c:"return the favour",       d:"to do something helpful for someone who helped you"},
  {c:"make sense",              d:"to be logical or understandable"}
];

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ============ SOUND ============ */
let audioCtx = null;
function tone(freq, dur, delay, type, vol){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (delay||0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  }catch(e){}
}
const sfxGood = () => { tone(660,.09,0,'sine',.06); tone(990,.13,.08,'sine',.05); };
const sfxBad  = () => { tone(180,.18,0,'sawtooth',.05); };
const sfxWin  = () => { [523,659,784,1047].forEach((f,i)=>tone(f,.16,i*.09,'sine',.055)); };

/* ============ TABS ============ */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    $('panel-' + tab.dataset.mode).classList.add('active');
    if(tab.dataset.mode === 'quiz' && quiz.qs.length === 0) startQuiz();
    if(tab.dataset.mode === 'match' && match.tiles.length === 0) startMatch();
  };
});

/* ==================================================
   MODE 1 — FLASHCARDS
================================================== */
let sOrder = DATA.map((_,i)=>i);
let sIdx = 0;
const flipCard = $('flipCard');

function renderStudy(){
  const item = DATA[sOrder[sIdx]];
  $('sFront').textContent = item.c;
  $('sBack').textContent  = item.d;
  $('sCounter').textContent = `${sIdx+1} / ${sOrder.length}`;
  $('sBar').style.width = ((sIdx+1)/sOrder.length*100) + '%';
  flipCard.classList.remove('flipped');
}
function stepStudy(n){ sIdx = (sIdx + n + sOrder.length) % sOrder.length; renderStudy(); }

flipCard.onclick = () => flipCard.classList.toggle('flipped');
$('sFlip').onclick  = () => flipCard.classList.toggle('flipped');
$('sNext').onclick  = () => stepStudy(1);
$('sPrev').onclick  = () => stepStudy(-1);
$('sShuffle').onclick = () => {
  shuffle(sOrder); sIdx = 0;
  renderStudy();
  $('sShuffle').textContent = '✅ Shuffled';
  setTimeout(()=> $('sShuffle').textContent = '🔀 Shuffle', 900);
};
document.addEventListener('keydown', e=>{
  if(!$('panel-study').classList.contains('active')) return;
  if(e.key === 'ArrowRight') stepStudy(1);
  if(e.key === 'ArrowLeft')  stepStudy(-1);
  if(e.key === ' ')          { e.preventDefault(); flipCard.classList.toggle('flipped'); }
});
renderStudy();

/* ==================================================
   MODE 2 — QUIZ
================================================== */
const QUIZ_LEN = 10;
let quiz = { qs:[], i:0, score:0, answered:false };

function startQuiz(){
  const pool = shuffle([...DATA]).slice(0, QUIZ_LEN);
  quiz.qs = pool.map(item => {
    const dir = Math.random() < 0.5 ? 'def2col' : 'col2def';
    const others = shuffle(DATA.filter(x => x.c !== item.c)).slice(0, 3);
    if(dir === 'def2col'){
      return { dir, question: item.d, correct: item.c,
               options: shuffle([item.c, ...others.map(o=>o.c)]) };
    }
    return   { dir, question: item.c, correct: item.d,
               options: shuffle([item.d, ...others.map(o=>o.d)]) };
  });
  quiz.i = 0; quiz.score = 0; quiz.answered = false;
  renderQuiz();
}

function renderQuiz(){
  const total = quiz.qs.length;

  if(quiz.i >= total){ renderQuizResults(); return; }

  const q = quiz.qs[quiz.i];
  $('qBar').style.width   = (quiz.i / total * 100) + '%';
  $('qCount').textContent = `Question ${quiz.i+1} / ${total}`;
  $('qScore').textContent = `⭐ ${quiz.score}`;

  const tag = q.dir === 'def2col'
      ? 'WHICH COLLOCATION MEANS…'
      : 'WHAT DOES THIS COLLOCATION MEAN?';

  const body = $('quizBody');
  body.innerHTML = `
    <div class="question">
      <div class="qtag">${tag}</div>
      <h3>${q.question}</h3>
    </div>
    <div id="opts"></div>`;

  const opts = $('opts');
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = () => answerQuiz(b, opt, q);
    opts.appendChild(b);
  });
}

function answerQuiz(btn, opt, q){
  if(quiz.answered) return;
  quiz.answered = true;

  [...$('opts').children].forEach(b => {
    if(b.textContent === q.correct) b.classList.add('correct');
  });

  if(opt === q.correct){ quiz.score++; sfxGood(); }
  else { btn.classList.add('wrong'); sfxBad(); }

  const total = quiz.qs.length;
  $('qBar').style.width   = ((quiz.i + 1) / total * 100) + '%';
  $('qScore').textContent = `⭐ ${quiz.score}`;

  setTimeout(() => {
    quiz.i++;
    quiz.answered = false;
    renderQuiz();
  }, 1250);
}

function renderQuizResults(){
  const total = quiz.qs.length;
  const pct = quiz.score / total;
  const msg = pct === 1   ? "Perfect score! You're a collocation master 🏆"
            : pct >= 0.8  ? "Excellent work! 🌟"
            : pct >= 0.6  ? "Good job — almost there! 👍"
            : pct >= 0.4  ? "Not bad. Keep practising! 💪"
            : "Every try makes you better 🚀";
  $('qBar').style.width = '100%';
  $('qCount').textContent = `Done!`;
  $('quizBody').innerHTML = `
    <div class="results">
      <div class="score-ring">${quiz.score}/${total}</div>
      <p class="msg">${msg}</p>
      <button class="btn primary" id="quizAgain">Play again 🔁</button>
    </div>`;
  $('quizAgain').onclick = startQuiz;
  if(pct >= 0.8) sfxWin();
}

/* ==================================================
   MODE 3 — MATCH
================================================== */
const PAIRS = 5;
let match = { tiles:[], selected:[], matched:0, moves:0, lock:false };

function startMatch(){
  const pool = shuffle([...DATA]).slice(0, PAIRS);
  match.tiles = [];
  pool.forEach((item, idx) => {
    match.tiles.push({ id: idx, type: 'col', text: item.c });
    match.tiles.push({ id: idx, type: 'def', text: item.d });
  });
  shuffle(match.tiles);
  match.selected = []; match.matched = 0; match.moves = 0; match.lock = false;
  $('mWin').innerHTML = '';
  renderMatch();
}

function renderMatch(){
  $('mMoves').textContent = 'Moves: ' + match.moves;
  $('mPairs').textContent = `${match.matched} / ${PAIRS} pairs`;
  $('mBar').style.width   = (match.matched / PAIRS * 100) + '%';

  const box = $('mTiles');
  box.innerHTML = '';
  match.tiles.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.idx = i;
    el.textContent = t.text;
    el.onclick = () => clickTile(el, i);
    box.appendChild(el);
  });
}

function clickTile(el, i){
  if(match.lock) return;
  if(el.classList.contains('matched') || el.classList.contains('sel')) return;

  el.classList.add('sel');
  match.selected.push({ el, tile: match.tiles[i] });

  if(match.selected.length < 2) return;

  match.moves++;
  $('mMoves').textContent = 'Moves: ' + match.moves;

  const [a, b] = match.selected;

  if(a.tile.id === b.tile.id){
    a.el.classList.remove('sel'); b.el.classList.remove('sel');
    a.el.classList.add('matched'); b.el.classList.add('matched');
    match.matched++;
    match.selected = [];
    sfxGood();
    $('mPairs').textContent = `${match.matched} / ${PAIRS} pairs`;
    $('mBar').style.width   = (match.matched / PAIRS * 100) + '%';
    if(match.matched === PAIRS) setTimeout(showMatchWin, 420);
  } else {
    match.lock = true;
    a.el.classList.add('bad'); b.el.classList.add('bad');
    sfxBad();
    setTimeout(() => {
      a.el.classList.remove('sel','bad');
      b.el.classList.remove('sel','bad');
      match.selected = []; match.lock = false;
    }, 680);
  }
}

function showMatchWin(){
  sfxWin();
  const perfect = match.moves <= PAIRS + 2;
  $('mWin').innerHTML = `
    <div class="win">
      <h4>${perfect ? '🏆 Flawless memory!' : '🎉 All pairs matched!'}</h4>
      <p>You did it in <strong>${match.moves}</strong> moves.</p>
      <button class="btn primary" id="mAgain">Play again 🔁</button>
    </div>`;
  $('mAgain').onclick = startMatch;
}

$('mRestart').onclick = startMatch;

/* init quiz lazily so tab click starts it */
</script>
</body>
</html>
