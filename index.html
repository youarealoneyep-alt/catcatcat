<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форсайт: Будущее образования с ИИ</title>
<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --indigo:#4f46e5; --indigo-d:#4338ca;
    --teal:#0d9488; --amber:#f59e0b; --rose:#e11d48;
    --bg:#f8fafc; --card:#ffffff;
    --shadow:0 10px 30px -12px rgba(15,23,42,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 45%,#ecfeff 100%);
    color:var(--ink);line-height:1.55;min-height:100vh;
    padding:24px 14px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}

  /* Header */
  header{
    text-align:center;margin-bottom:28px;
  }
  .badge-top{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--indigo);
    background:#e0e7ff;padding:7px 16px;border-radius:99px;margin-bottom:14px;
  }
  header h1{
    font-size:34px;line-height:1.15;margin-bottom:10px;
    background:linear-gradient(120deg,var(--indigo),var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);font-size:16px;max-width:720px;margin:0 auto}

  /* Steps indicator */
  .steps{
    display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:24px 0 30px;
  }
  .step-dot{
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;color:var(--muted);
    background:#fff;border:1.5px solid var(--line);
    padding:8px 14px;border-radius:99px;transition:.25s;
  }
  .step-dot.active{
    color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-d));
    border-color:transparent;box-shadow:0 8px 20px -8px rgba(79,70,229,.7);
  }
  .step-dot.done{
    color:var(--teal);border-color:#99f6e4;background:#f0fdfa;
  }
  .step-dot .num{
    width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    background:var(--line);color:var(--muted);font-size:12px;
  }
  .step-dot.active .num{background:rgba(255,255,255,.25);color:#fff}
  .step-dot.done .num{background:#ccfbf1;color:var(--teal)}

  /* Cards */
  .card{
    background:var(--card);border-radius:20px;padding:28px;
    box-shadow:var(--shadow);border:1px solid var(--line);
    margin-bottom:22px;animation:fade .4s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .card h2{
    font-size:22px;margin-bottom:6px;display:flex;align-items:center;gap:10px;
  }
  .card h2 .ico{font-size:26px}
  .card .sub{color:var(--muted);font-size:14.5px;margin-bottom:20px}

  /* Article block */
  .article-box{
    background:#f1f5f9;border-left:5px solid var(--indigo);
    border-radius:12px;padding:18px 20px;margin:18px 0;font-size:14.5px;
  }
  .article-box .label{
    font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--indigo);margin-bottom:8px;
  }
  .article-box p{margin-bottom:10px;color:#334155}
  .article-box p:last-child{margin-bottom:0}
  .article-box strong{color:var(--indigo-d)}

  .quote{
    font-style:italic;color:var(--muted);
    border-left:3px solid var(--amber);padding-left:14px;margin:14px 0;
    font-size:14px;
  }

  /* Trend grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
  .trend{
    background:#f8fafc;border:1.5px solid var(--line);border-radius:14px;
    padding:16px;transition:.2s;cursor:pointer;
  }
  .trend:hover{border-color:var(--indigo);transform:translateY(-3px);box-shadow:0 12px 24px -16px rgba(79,70,229,.5)}
  .trend .t-ico{font-size:24px;margin-bottom:8px}
  .trend .t-title{font-weight:800;font-size:15px;margin-bottom:6px}
  .trend .t-desc{font-size:13px;color:var(--muted);line-height:1.5}

  /* Scenario builder */
  .scenario-inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .scenario-inputs label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .scenario-inputs select,.scenario-inputs input{
    width:100%;font:inherit;font-size:14px;padding:12px 14px;
    border-radius:12px;border:1.5px solid var(--line);background:#fff;
    transition:.2s;
  }
  .scenario-inputs select:focus,.scenario-inputs input:focus{
    outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(79,70,229,.12);
  }

  /* Triad */
  .triad{
    display:flex;justify-content:center;align-items:center;gap:14px;
    flex-wrap:wrap;margin:20px 0;
  }
  .triad-node{
    width:140px;padding:18px 10px;text-align:center;border-radius:16px;
    background:#f8fafc;border:2px solid var(--line);transition:.25s;
  }
  .triad-node .n-ico{font-size:30px;margin-bottom:6px}
  .triad-node .n-name{font-weight:800;font-size:13.5px}
  .triad-node .n-role{font-size:11.5px;color:var(--muted);margin-top:4px}
  .triad-node:hover{border-color:var(--indigo);background:#eef2ff}
  .triad-arrow{font-size:24px;color:var(--indigo);font-weight:800}

  /* Method stages */
  .stages{counter-reset:st;display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .stage{
    display:flex;gap:14px;align-items:flex-start;
    background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    transition:.2s;
  }
  .stage:hover{background:#eef2ff;border-color:#c7d2fe}
  .stage::before{
    counter-increment:st;content:counter(st);
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;
    background:linear-gradient(135deg,var(--indigo),var(--indigo-d));
    color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;
  }
  .stage .s-body{font-size:14px}
  .stage .s-body strong{color:var(--indigo-d)}

  /* Roadmap output */
  .roadmap{
    background:linear-gradient(135deg,#1e1b4b,#0f172a);
    color:#e2e8f0;border-radius:20px;padding:28px;margin-top:20px;
  }
  .roadmap h3{color:#a5b4fc;font-size:20px;margin-bottom:16px}
  .roadmap .r-item{
    display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(148,163,184,.2);
    font-size:14px;
  }
  .roadmap .r-item:last-child{border-bottom:none}
  .roadmap .r-num{
    width:26px;height:26px;flex:0 0 26px;border-radius:8px;
    background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;
  }
  .roadmap .r-text strong{color:#fbbf24}

  /* Buttons */
  .btn{
    font:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:none;border-radius:14px;padding:13px 26px;
    color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-d));
    box-shadow:0 10px 22px -10px rgba(79,70,229,.8);
    transition:.18s;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(79,70,229,.9)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.teal{background:linear-gradient(135deg,var(--teal),#0f766e);box-shadow:0 10px 22px -10px rgba(13,148,136,.8)}
  .btn.ghost{background:#fff;color:var(--indigo);border:2px solid #c7d2fe;box-shadow:none}
  .btn.ghost:hover{background:#eef2ff;box-shadow:none}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

  /* Progress bar */
  .pbar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .pbar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--teal));transition:width .5s cubic-bezier(.4,0,.2,1)}

  /* Reflection */
  .reflect{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .reflect-item label{display:block;font-size:13.5px;font-weight:800;margin-bottom:6px;color:#334155}
  .reflect-item textarea{
    width:100%;font:inherit;font-size:14px;padding:12px 14px;
    border-radius:12px;border:1.5px solid var(--line);resize:vertical;min-height:70px;
    transition:.2s;
  }
  .reflect-item textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(79,70,229,.12)}

  /* Utility */
  .hidden{display:none !important}
  .tag{
    display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;
    background:#e0e7ff;color:var(--indigo);margin-right:6px;margin-bottom:6px;
  }
  .tag.teal{background:#ccfbf1;color:#0f766e}
  .tag.amber{background:#fef3c7;color:#92400e}

  @media(max-width:640px){
    header h1{font-size:26px}
    .card{padding:20px 16px}
    .scenario-inputs{grid-template-columns:1fr}
    .triad-node{width:110px;padding:14px 8px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge-top">Технология Форсайт · Занятие</div>
    <h1>Будущее образования с искусственным интеллектом</h1>
    <p>Интерактивная форсайт-сессия на основе методики обучения письменной речи в триаде «обучающийся — преподаватель — искусственный интеллект» (Сысоев П.В., Филатов Е.М., 2024).</p>
  </header>

  <div class="steps" id="stepsBar"></div>
  <div class="pbar"><div class="pbar-fill" id="pbarFill"></div></div>

  <main id="stageArea"></main>

</div>

<script>
/* =========================================================
   ДАННЫЕ СТАДИЙ ФОРСАЙТ-СЕССИИ
   ========================================================= */
const STEPS = [
  { id:'intro',      label:'Введение',        ico:'📖' },
  { id:'trends',     label:'Тренды',          ico:'📈' },
  { id:'triad',      label:'Триада',          ico:'🔺' },
  { id:'method',     label:'Методика',        ico:'🧩' },
  { id:'scenario',   label:'Сценарий',        ico:'🎛️' },
  { id:'roadmap',    label:'Дорожная карта',  ico:'🗺️' },
  { id:'reflect',    label:'Рефлексия',       ico:'💭' }
];

const state = {
  step: 0,
  selectedTrends: new Set(),
  scenario: { horizon:'2030', aiRole:'', teacherRole:'', risk:'' },
  reflection: { what:'', how:'', risk:'' }
};

const area = document.getElementById('stageArea');
const stepsBar = document.getElementById('stepsBar');
const pbarFill = document.getElementById('pbarFill');

/* =========================================================
   ОТРИСОВКА ИНДИКАТОРА ШАГОВ
   ========================================================= */
function renderSteps(){
  stepsBar.innerHTML = STEPS.map((s, i) => {
    let cls = 'step-dot';
    if (i === state.step) cls += ' active';
    else if (i < state.step) cls += ' done';
    const num = i < state.step ? '✓' : (i + 1);
    return `<div class="${cls}"><span class="num">${num}</span>${s.ico} ${s.label}</div>`;
  }).join('');
  const pct = ((state.step) / (STEPS.length - 1)) * 100;
  pbarFill.style.width = pct + '%';
}

/* =========================================================
   ПЕРЕХОД МЕЖДУ СТАДИЯМИ
   ========================================================= */
function goTo(idx){
  state.step = idx;
  renderSteps();
  renderStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   РЕНДЕР СТАДИИ
   ========================================================= */
function renderStage(){
  const id = STEPS[state.step].id;
  if (id === 'intro')    return renderIntro();
  if (id === 'trends')   return renderTrends();
  if (id === 'triad')    return renderTriad();
  if (id === 'method')   return renderMethod();
  if (id === 'scenario') return renderScenario();
  if (id === 'roadmap')  return renderRoadmap();
  if (id === 'reflect')  return renderReflect();
}

/* =========================================================
   1. ВВЕДЕНИЕ — СТАТЬЯ
   ========================================================= */
function renderIntro(){
  area.innerHTML = `
    <div class="card">
      <h2><span class="ico">📖</span> Введение: почему это важно</h2>
      <p class="sub">Форсайт-сессия опирается на исследование П.В. Сысоева и Е.М. Филатова (2024) о методике обучения письменной речи в триаде «обучающийся — преподаватель — искусственный интеллект».</p>

      <div class="article-box">
        <div class="label">Из статьи · Аннотация</div>
        <p>Интеграция технологий искусственного интеллекта (ИИ) в систему образования позволяет значительно обогатить иноязычную практику обучающихся. Вместе с тем постепенное внедрение ИИ-инструментов может вызывать опасения педагогов, связанные с исключением преподавателя из процесса обучения.</p>
        <p>В качестве современной парадигмы образования авторы предлагают триаду <strong>«обучающийся — преподаватель — искусственный интеллект»</strong>, в рамках которой взаимодействие обучающихся с ИИ встраивается в традиционную методику обучения.</p>
      </div>

      <div class="article-box" style="border-left-color:var(--teal);background:#f0fdfa">
        <div class="label" style="color:var(--teal)">Ключевые тезисы статьи</div>
        <p><strong>1.</strong> Обучению письменной речи часто уделяется мало времени из-за трудоёмкости проверки работ.</p>
        <p><strong>2.</strong> ИИ способен взять на себя оценку письменных работ и предоставление обратной связи.</p>
        <p><strong>3.</strong> Преподаватель <strong>не исключается</strong> из процесса — он обогащает традиционную методику.</p>
        <p><strong>4.</strong> Особое внимание — соблюдению норм авторской этики и обсуждению результатов взаимодействия с ИИ в аудитории.</p>
      </div>

      <div class="quote">
        «Преподаватель не исключается из процесса обучения учащихся или студентов иностранному языку и оценки их письменных работ. Традиционная методика обогащается дополнительными этапами по взаимодействию с ИИ».
      </div>

      <p style="font-size:14px;color:var(--muted);margin-top:14px">
        <span class="tag">ИИ в образовании</span>
        <span class="tag teal">Триада</span>
        <span class="tag amber">Авторская этика</span>
        <span class="tag">Обратная связь</span>
      </p>

      <div class="btn-row">
        <button class="btn" id="nextBtn">Начать форсайт →</button>
      </div>
    </div>
  `;
  document.getElementById('nextBtn').addEventListener('click', () => goTo(1));
}

/* =========================================================
   2. ТРЕНДЫ
   ========================================================= */
const TRENDS = [
  { ico:'🤖', title:'ИИ как третий субъект обучения', desc:'ИИ становится равноправным участником образовательного процесса наряду с обучающимся и преподавателем.' },
  { ico:'✍️', title:'Автоматическая обратная связь', desc:'ИИ-инструменты (ChatGPT, Grammarly) дают мгновенную оценку и рекомендации по доработке работ.' },
  { ico:'🎓', title:'Смешанное обучение', desc:'Часть этапов — внеаудиторно с ИИ, часть — аудиторно с преподавателем и обсуждением в группах.' },
  { ico:'⚖️', title:'Авторская этика', desc:'Риск плагиата и генерации текстов ИИ за своих — ключевой вызов для академической среды.' },
  { ico:'🧠', title:'Критическое мышление', desc:'Анализ и оценка сгенерированных ИИ текстов развивают критическое отношение к информации.' },
  { ico:'📊', title:'Оценка содержания', desc:'Главный спор: способен ли ИИ оценить глубину содержания, а не только форму и лексику.' },
  { ico:'🌐', title:'Доступность', desc:'ИИ-инструменты снижают барьеры и дают обратную связь там, где не хватает преподавательских часов.' },
  { ico:'🏫', title:'Новая роль преподавателя', desc:'От проверяющего — к фасилитатору обсуждения и наставнику по работе с ИИ.' }
];

function renderTrends(){
  area.innerHTML = `
    <div class="card">
      <h2><span class="ico">📈</span> Шаг 1. Карта трендов</h2>
      <p class="sub">Выберите 3–4 тренда, которые, по вашему мнению, сильнее всего повлияют на будущее образования с ИИ. Нажмите на карточку, чтобы отметить.</p>
      <div class="grid" id="trendGrid">
        ${TRENDS.map((t, i) => `
          <div class="trend" data-i="${i}">
            <div class="t-ico">${t.ico}</div>
            <div class="t-title">${t.title}</div>
            <div class="t-desc">${t.desc}</div>
          </div>
        `).join('')}
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="backBtn">← Назад</button>
        <button class="btn" id="nextBtn" disabled>Далее →</button>
      </div>
    </div>
  `;

  const grid = document.getElementById('trendGrid');
  const nextBtn = document.getElementById('nextBtn');

  grid.querySelectorAll('.trend').forEach(el => {
    el.addEventListener('click', () => {
      const i = Number(el.dataset.i);
      if (state.selectedTrends.has(i)) {
        state.selectedTrends.delete(i);
        el.style.borderColor = '';
        el.style.background = '';
      } else {
        state.selectedTrends.add(i);
        el.style.borderColor = 'var(--indigo)';
        el.style.background = '#eef2ff';
      }
      nextBtn.disabled = state.selectedTrends.size < 2;
    });
  });

  document.getElementById('backBtn').addEventListener('click', () => goTo(0));
  nextBtn.addEventListener('click', () => goTo(2));
}

/* =========================================================
   3. ТРИАДА
   ========================================================= */
function renderTriad(){
  area.innerHTML = `
    <div class="card">
      <h2><span class="ico">🔺</span> Шаг 2. Триада «обучающийся — преподаватель — ИИ»</h2>
      <p class="sub">Ключевая идея статьи: ИИ не заменяет преподавателя, а дополняет его. Рассмотрите роли каждого участника.</p>

      <div class="triad">
        <div class="triad-node">
          <div class="n-ico">🧑‍🎓</div>
          <div class="n-name">Обучающийся</div>
          <div class="n-role">Пишет, анализирует, рефлексирует</div>
        </div>
        <div class="triad-arrow">⇄</div>
        <div class="triad-node">
          <div class="n-ico">👩‍🏫</div>
          <div class="n-name">Преподаватель</div>
          <div class="n-role">Обучает, фасилитирует, оценивает</div>
        </div>
        <div class="triad-arrow">⇄</div>
        <div class="triad-node">
          <div class="n-ico">🤖</div>
          <div class="n-name">Искусственный интеллект</div>
          <div class="n-role">Генерирует, оценивает, рекомендует</div>
        </div>
      </div>

      <div class="article-box">
        <div class="label">Из статьи · О роли преподавателя</div>
        <p>«Преподаватель не исключается из процесса обучения… Традиционная методика обучения письменной речи обогащается дополнительными этапами по взаимодействию с ИИ, создавая дополнительные условия для обучающихся развивать необходимые иноязычные речевые умения».</p>
      </div>

      <div class="article-box" style="border-left-color:var(--teal);background:#f0fdfa">
        <div class="label" style="color:var(--teal)">Новые акценты методики</div>
        <p><strong>а)</strong> Соблюдение обучающимися норм авторской этики при получении обратной связи от ИИ.</p>
        <p><strong>б)</strong> Необходимость обсуждения во время аудиторных занятий результатов взаимодействия обучающихся с ИИ.</p>
      </div>

      <div class="btn-row">
        <button class="btn ghost" id="backBtn">← Назад</button>
        <button class="btn" id="nextBtn">К методике →</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => goTo(1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(3));
}

/* =========================================================
   4. МЕТОДИКА — 11 ЭТАПОВ
   ========================================================= */
const STAGES = [
